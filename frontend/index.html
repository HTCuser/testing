<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý kỹ thuật — Nhà máy Thủy điện Hủa Na</title>
  <meta name="description"
        content="Hệ thống RAG tra cứu tài liệu kỹ thuật, quy trình vận hành, xử lý sự cố và bảo dưỡng sửa chữa Nhà máy Thủy điện Hủa Na">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>💧</text></svg>">
</head>
<body>
  <div id="root">
    <div style="display:grid;place-items:center;height:100vh;color:#7793a2">
      <div style="text-align:center">
        <div class="spinner" style="width:28px;height:28px"></div>
        <p style="margin-top:14px">Đang khởi động hệ thống…</p>
      </div>
    </div>
  </div>
  <script>
    // Sau khi cập nhật phần mềm, trình duyệt có thể còn giữ vài file giao diện cũ:
    // trang đứng mãi ở "Đang khởi động". Khi đó tự nạp lại toàn bộ file một lần;
    // vẫn không được thì hướng dẫn người dùng.
    (function () {
      var KEY = 'huana-boot-retry';
      var handled = false;
      function stuck() {
        if (handled || window.__appStarted) return;
        handled = true;
        var tried = false;
        try { tried = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); } catch (e) { tried = true; }
        if (!tried) {
          fetch('/api/giao-dien/tep', { cache: 'reload' }).then(function (r) { return r.json(); })
            .then(function (d) { return Promise.all(d.files.map(function (f) { return fetch(f, { cache: 'reload' }); })); })
            .catch(function () {})
            .then(function () { location.reload(); });
          return;
        }
        var p = document.querySelector('#root p');
        if (p) {
          p.innerHTML = 'Không nạp được giao diện.<br>Bấm <b>Ctrl + F5</b> để tải lại. Nếu vẫn vậy, kiểm tra cửa sổ run.bat còn chạy không.';
        }
        var s = document.querySelector('#root .spinner');
        if (s) s.style.display = 'none';
      }
      window.addEventListener('error', function () { setTimeout(stuck, 300); });
      setTimeout(stuck, 5000);
    })();
  </script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
