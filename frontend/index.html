<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý kỹ thuật — Nhà máy Thủy điện Hủa Na</title>
  <meta name="description"
        content="Hệ thống RAG tra cứu tài liệu kỹ thuật, quy trình vận hành, xử lý sự cố và bảo dưỡng sửa chữa Nhà máy Thủy điện Hủa Na">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>💧</text></svg>">
</head>
<body>
  <div id="root">
    <div style="display:grid;place-items:center;height:100vh;color:#7793a2">
      <div style="text-align:center">
        <div class="spinner" style="width:28px;height:28px"></div>
        <p style="margin-top:14px">Đang khởi động hệ thống…</p>
      </div>
    </div>
  </div>
  <script>
    // Sau khi cập nhật phần mềm, trình duyệt có thể còn giữ vài file giao diện cũ:
    // trang đứng mãi ở "Đang khởi động". Khi đó tự nạp lại toàn bộ file một lần;
    // vẫn không được thì hiện lỗi ngay trên trang để chụp gửi hỗ trợ.
    (function () {
      var KEY = 'huana-boot-retry';
      var handled = false;
      var errors = [];
      function remember(msg) { if (msg && errors.indexOf(msg) < 0) errors.push(String(msg)); }
      window.addEventListener('error', function (e) {
        var src = e.target && e.target !== window && (e.target.src || e.target.href);
        remember(src ? 'Không tải được ' + src : e.message);
        if (!window.__appStarted) setTimeout(stuck, 300);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        remember(e.reason && (e.reason.message || e.reason));
      });
      function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
      function show(serverOk) {
        var box = document.querySelector('#root > div > div');
        if (!box) return;
        box.style.maxWidth = '640px';
        box.innerHTML = '<p style="font-size:17px;color:#b42318;font-weight:600">Không mở được giao diện</p>'
          + '<p style="margin-top:10px">' + (serverOk
            ? 'Máy chủ vẫn trả lời. Bấm <b>Ctrl + F5</b> để tải lại.'
            : 'Máy chủ không trả lời: xem cửa sổ <b>run.bat</b> còn chạy không, có báo lỗi gì không.') + '</p>'
          + (errors.length ? '<pre style="text-align:left;white-space:pre-wrap;margin-top:12px;padding:10px;background:#f4f6f8;color:#333;font-size:12.5px;border-radius:6px">'
            + esc(errors.slice(0, 5).join('\n')) + '</pre>' : '')
          + '<p style="margin-top:10px;font-size:13px">Vẫn không được thì chụp màn hình này gửi hỗ trợ.</p>';
      }
      function stuck() {
        if (handled || window.__appStarted) return;
        handled = true;
        var tried = false;
        try { tried = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); } catch (e) { tried = true; }
        if (!tried) {
          fetch('/api/giao-dien/tep', { cache: 'reload' }).then(function (r) { return r.json(); })
            .then(function (d) { return Promise.all(d.files.map(function (f) { return fetch(f, { cache: 'reload' }); })); })
            .catch(function () {})
            .then(function () { location.reload(); });
          return;
        }
        try { sessionStorage.removeItem(KEY); } catch (e) { /* bỏ qua */ }
        fetch('/healthz', { cache: 'no-store' }).then(function (r) { show(r.ok); }, function () { show(false); });
      }
      setTimeout(stuck, 8000);
    })();
  </script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
